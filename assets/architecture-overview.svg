<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="code_to_graph architecture overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#f4fbff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 40px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 20px Arial, sans-serif; fill: #334155; }
      .label { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .desc { font: 500 14px Arial, sans-serif; fill: #e2e8f0; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="60" y="72" class="title">code_to_graph Architecture Overview</text>
  <text x="60" y="108" class="subtitle">Production documentation and debugging automation pipeline</text>

  <rect x="70" y="180" width="220" height="120" rx="16" fill="url(#node)"/>
  <text x="95" y="224" class="label">CLI Entry</text>
  <text x="95" y="248" class="desc">main.py</text>

  <rect x="350" y="180" width="240" height="120" rx="16" fill="url(#node)"/>
  <text x="375" y="224" class="label">Pipeline Core</text>
  <text x="375" y="248" class="desc">pipeline.py</text>

  <rect x="650" y="120" width="250" height="120" rx="16" fill="url(#node)"/>
  <text x="675" y="164" class="label">Graph Build / Ingest</text>
  <text x="675" y="188" class="desc">parser + Bevel adapter</text>

  <rect x="650" y="280" width="250" height="120" rx="16" fill="url(#node)"/>
  <text x="675" y="324" class="label">LLM Enrichment</text>
  <text x="675" y="348" class="desc">query_engine.py</text>

  <rect x="960" y="120" width="250" height="120" rx="16" fill="url(#node)"/>
  <text x="985" y="164" class="label">Workflow + Metadata</text>
  <text x="985" y="188" class="desc">workflow / tags / routes</text>

  <rect x="960" y="280" width="250" height="120" rx="16" fill="url(#node)"/>
  <text x="985" y="324" class="label">Docs + Assets</text>
  <text x="985" y="348" class="desc">PDF + JSON outputs</text>

  <rect x="350" y="500" width="260" height="120" rx="16" fill="url(#node)"/>
  <text x="375" y="544" class="label">Debug Agent</text>
  <text x="375" y="568" class="desc">error text / trace to fixes</text>

  <rect x="700" y="500" width="260" height="120" rx="16" fill="url(#node)"/>
  <text x="725" y="544" class="label">Safe Auto-Fix</text>
  <text x="725" y="568" class="desc">dry-run/apply + rollback</text>

  <path d="M290 240 L350 240" class="edge"/>
  <path d="M590 240 L650 180" class="edge"/>
  <path d="M590 240 L650 340" class="edge"/>
  <path d="M900 180 L960 180" class="edge"/>
  <path d="M900 340 L960 340" class="edge"/>
  <path d="M520 300 L480 500" class="edge"/>
  <path d="M760 400 L830 500" class="edge"/>

  <text x="60" y="680" class="subtitle">Artifacts: code_documentation.pdf, function_descriptions.json, test_scenarios.json, debug_fix_report.json, autofix_report.json</text>
</svg>
